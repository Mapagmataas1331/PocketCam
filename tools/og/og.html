<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Open Graph card template for pocketcam.ma.cyou. Render at 1200x630, see tools/og/README.md. -->
<style>
  :root {
    --bg: #0b0a14; --bg-2: #120f24;
    --glow-1: rgba(124, 92, 255, 0.34); --glow-2: rgba(56, 189, 248, 0.14);
    --card: rgba(255, 255, 255, 0.055); --line: rgba(255, 255, 255, 0.12); --line-strong: rgba(255, 255, 255, 0.2);
    --text: #f1f0f7; --muted: #a6a3bd; --accent: #7c5cff; --accent-2: #9d86ff; --star: rgba(255, 255, 255, 0.75);
    --mono: "Cascadia Code", "SF Mono", Consolas, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
    color: var(--text); position: relative;
    background:
      radial-gradient(760px 460px at 82% -10%, var(--glow-1), transparent 70%),
      radial-gradient(620px 420px at -10% 30%, var(--glow-2), transparent 70%),
      radial-gradient(1.4px 1.4px at 12% 18%, var(--star), transparent 60%),
      radial-gradient(1px 1px at 28% 8%, var(--star), transparent 60%),
      radial-gradient(1.6px 1.6px at 44% 88%, var(--star), transparent 60%),
      radial-gradient(1px 1px at 63% 6%, var(--star), transparent 60%),
      radial-gradient(1.2px 1.2px at 96% 52%, var(--star), transparent 60%),
      radial-gradient(1.6px 1.6px at 90% 92%, var(--star), transparent 60%),
      radial-gradient(1px 1px at 5% 70%, var(--star), transparent 60%),
      radial-gradient(1.2px 1.2px at 36% 64%, var(--star), transparent 60%),
      radial-gradient(1px 1px at 22% 94%, var(--star), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  }
  .left { position: absolute; left: 64px; top: 58px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 650; font-size: 34px; letter-spacing: 0.01em; }
  .brand img { width: 60px; height: 60px; border-radius: 15px; box-shadow: 0 10px 30px -10px rgba(124, 92, 255, 0.8); }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px; margin: 38px 0 22px;
    font-size: 20px; color: var(--muted); border: 1px solid var(--line); background: var(--card);
    padding: 6px 16px; border-radius: 999px;
  }
  .eyebrow::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2); }
  h1 { margin: 0; font-size: 64px; line-height: 1.04; letter-spacing: -0.025em; font-weight: 750; }
  .grad { background: linear-gradient(92deg, var(--accent) 0%, #38bdf8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .flow { font-family: var(--mono); font-size: 18px; color: var(--muted); margin-top: 34px; display: flex; align-items: center; gap: 10px; }
  .flow span { border: 1px solid var(--line); background: var(--card); padding: 5px 12px; border-radius: 9px; color: var(--text); }
  .url { position: absolute; left: 64px; bottom: 48px; font-family: var(--mono); font-size: 20px; color: var(--accent-2); letter-spacing: 0.02em; }
  .stage { position: absolute; left: 620px; top: 104px; width: 560px; }
  .stage::after { content: ""; position: absolute; inset: 10% 15% 0 5%; z-index: -1; background: radial-gradient(closest-side, var(--glow-1), transparent); filter: blur(24px); }
  .pc { display: block; width: 500px; height: auto; border-radius: 12px; border: 1px solid var(--line-strong); box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8); background: #111; }
  .phone { position: absolute; right: 0; top: 150px; width: 152px; height: auto; border-radius: 20px; border: 1px solid var(--line-strong); box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8), 0 0 0 7px var(--bg-2); background: #111; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><img src="../../images/apple-touch-icon.png" alt=""><span>PocketCam</span></div>
    <div class="eyebrow">Free for Windows 11 · no phone app</div>
    <h1>Your phone is a <span class="grad">Windows webcam.</span></h1>
    <div class="flow"><span>Phone browser</span>→<span>your PC</span>→<span>any webcam app</span></div>
  </div>
  <div class="url">pocketcam.ma.cyou</div>
  <div class="stage">
    <img class="pc" src="../../images/desktop-running.webp" alt="">
    <img class="phone" src="../../images/phone-running.webp" alt="">
  </div>
</body>
</html>
